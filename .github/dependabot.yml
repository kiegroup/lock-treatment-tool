version: 2
updates:
  # Enable version updates for npm
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "monthly"
    exclude-paths:
      - "**/test/resources/**"
      - "**/src/test/resources/**"
    # Only update production dependencies (excludes devDependencies/test tools)
    allow:
      - dependency-type: "production"
